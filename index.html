<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok</title>
    <meta name="description" content="Watch, discover, and create on TikTok" />
    <link rel="icon" type="image/png" href="og/favicon.png" />

    <!-- Open Graph — large card for social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TikTok" />
    <meta property="og:title" content="TikTok" />
    <meta property="og:description" content="Make Your Day 🎵" />
    <meta property="og:url" content="https://toktik.lol/" />
    <meta property="og:image" content="https://toktik.lol/og/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter / X — summary_large_image shows the big card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TikTok" />
    <meta name="twitter:description" content="Make Your Day 🎵" />
    <meta name="twitter:image" content="https://toktik.lol/og/preview.png" />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="visitor-blank">
    <!-- honeypot traps are mounted by js/honeypot.js -->
    <script src="config.js"></script>
    <script type="module">
      import { initVisitorPage } from "./js/visitor.js";
      initVisitorPage();
    </script>
  </body>
</html>
