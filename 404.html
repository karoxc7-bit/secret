<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok</title>
    <meta name="description" content="Watch, discover, and create on TikTok" />
    <link rel="icon" type="image/png" href="/og/favicon.png" />

    <!-- Open Graph — large card for social previews -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="TikTok" />
    <meta property="og:title" content="TikTok" />
    <meta property="og:description" content="Check out this TikTok profile 🎵" />
    <meta property="og:url" content="https://toktik.lol/" />
    <meta property="og:image" content="https://toktik.lol/og/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter / X — summary_large_image shows the big card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TikTok" />
    <meta name="twitter:description" content="Check out this TikTok profile 🎵" />
    <meta name="twitter:image" content="https://toktik.lol/og/preview.png" />

    <link rel="stylesheet" href="/css/style.css" />

    <script>
      // Update OG tags dynamically based on /<username> path
      (function () {
        var path = location.pathname.replace(/^\/+/, "").replace(/\/+$/, "");
        var tag = path.split("/")[0] || "";
        if (tag && tag !== "admin" && tag !== "sho" && tag !== "og") {
          document.title = "@" + tag + " on TikTok";
          var metas = {
            "og:title": "@" + tag + " on TikTok",
            "og:description": "Check out @" + tag + "'s videos on TikTok 🎵",
            "og:url": location.href,
            "twitter:title": "@" + tag + " on TikTok",
            "twitter:description": "Check out @" + tag + "'s videos on TikTok 🎵",
          };
          for (var key in metas) {
            var el =
              document.querySelector('meta[property="' + key + '"]') ||
              document.querySelector('meta[name="' + key + '"]');
            if (el) el.setAttribute("content", metas[key]);
          }
        }
      })();
    </script>
  </head>
  <body class="visitor-blank">
    <script src="/config.js"></script>
    <script type="module">
      import { initVisitorPage } from "/js/visitor.js";
      initVisitorPage();
    </script>
  </body>
</html>
