<!DOCTYPE html>
<html lang="ku" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Chat Widget — Script</title>
    <link rel="icon" type="image/png" href="../icons/favicon.png" />
    <style>
      :root {
        --bg: #0b1220;
        --panel: #121a2b;
        --border: #243149;
        --text: #e8eef6;
        --muted: #8b9bb0;
        --accent: #3b82f6;
        --ok: #22c55e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(900px 420px at 90% -10%, rgba(59, 130, 246, 0.16), transparent 55%),
          radial-gradient(700px 360px at 0% 100%, rgba(6, 182, 212, 0.1), transparent 50%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 16px 48px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      .top h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .top p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .copy-btn {
        margin-inline-start: auto;
        width: 44px;
        height: 44px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease,
          transform 0.15s ease;
        flex-shrink: 0;
      }
      .copy-btn:hover {
        border-color: var(--accent);
        color: #fff;
        transform: translateY(-1px);
      }
      .copy-btn.copied {
        border-color: var(--ok);
        color: var(--ok);
      }
      .copy-btn svg {
        width: 20px;
        height: 20px;
      }
      .code-shell {
        position: relative;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel);
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .code-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #334155;
      }
      .dot:nth-child(1) {
        background: #ef4444;
      }
      .dot:nth-child(2) {
        background: #f59e0b;
      }
      .dot:nth-child(3) {
        background: #22c55e;
      }
      .fname {
        margin-inline-start: 6px;
      }
      pre {
        margin: 0;
        padding: 16px;
        overflow: auto;
        max-height: calc(100vh - 160px);
        font-family: Consolas, "Courier New", monospace;
        font-size: 12.5px;
        line-height: 1.55;
        white-space: pre;
        tab-size: 2;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(12px);
        background: #14532d;
        color: #ecfdf5;
        border: 1px solid #22c55e;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 20;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .err {
        color: #fecaca;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div>
          <h1>DeepSeek Chat Widget</h1>
          <p>Tampermonkey / Violentmonkey — کلیک لە ئایکۆنی کۆپی بکە</p>
        </div>
        <button
          class="copy-btn"
          id="copyBtn"
          type="button"
          title="کۆپی کردنی کۆد"
          aria-label="Copy code"
        >
          <svg id="iconCopy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          <svg
            id="iconCheck"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            hidden
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
      </div>

      <div class="code-shell">
        <div class="code-bar">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="fname">deepseek-chat.user.js</span>
        </div>
        <pre id="code"><span class="err">بارکردن…</span></pre>
      </div>
    </div>

    <div class="toast" id="toast">کۆد کۆپی کرا ✓</div>

    <script>
      const codeEl = document.getElementById("code");
      const copyBtn = document.getElementById("copyBtn");
      const iconCopy = document.getElementById("iconCopy");
      const iconCheck = document.getElementById("iconCheck");
      const toast = document.getElementById("toast");
      let source = "";

      function showCopied() {
        copyBtn.classList.add("copied");
        iconCopy.hidden = true;
        iconCheck.hidden = false;
        toast.classList.add("show");
        setTimeout(() => {
          copyBtn.classList.remove("copied");
          iconCopy.hidden = false;
          iconCheck.hidden = true;
          toast.classList.remove("show");
        }, 1600);
      }

      async function copyCode() {
        if (!source) return;
        try {
          await navigator.clipboard.writeText(source);
          showCopied();
        } catch (_) {
          const ta = document.createElement("textarea");
          ta.value = source;
          ta.style.cssText = "position:fixed;left:-9999px;top:0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          showCopied();
        }
      }

      copyBtn.addEventListener("click", copyCode);

      fetch("./deepseek-chat.user.js", { cache: "no-store" })
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then((text) => {
          source = text;
          codeEl.textContent = text;
        })
        .catch((err) => {
          codeEl.innerHTML =
            '<span class="err">نەتوانرا کۆدەکە باربکرێت: ' +
            (err.message || err) +
            "</span>";
        });
    </script>
  </body>
</html>
